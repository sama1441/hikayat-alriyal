<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية الريال - نسخة تجريبية</title><style>body{margin:0;background:#f3f6fb;font-family:Tahoma,Arial;color:#172943}header{background:#112849;color:white;padding:18px;font-size:23px;font-weight:bold}main{max-width:1050px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #142a4614}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#1758a5;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer}button.alt{background:#e7edf6;color:#163455}button.danger{background:#aa3442}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cad4e3;border-radius:8px;font:inherit;margin-top:5px}label{display:block;margin:10px 0;font-size:14px}h2{margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.stat{background:#edf3fa;border-radius:10px;padding:13px}.stat b{display:block;font-size:20px;margin-top:6px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e7ef;padding:9px;text-align:right}small,.muted{color:#68788d}.hidden{display:none}.ok{color:#117b53}.bad{color:#b42f43}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#notice{padding:9px;color:#117b53} @media(max-width:500px){header{font-size:19px}main{padding:9px}}</style></head><body><header>🪙 حكاية الريال <small style="color:#cbd8eb"> | نسخة تجريبية — تخزين محلي</small></header><main><section class="card" id="login"><h2>تسجيل الدخول</h2><p class="muted">حسابات تجريبية: admin / 12345678 ، brother / 12345678 ، cashier / 12345678</p><label>اسم المستخدم<input id="user" autocomplete="username"></label><label>كلمة المرور<input id="pass" type="password" autocomplete="current-password"></label><button type="button" onclick="login()">دخول</button><p class="muted">إذا لم يستجب زر الدخول، افتح الملف في متصفح Safari أو Chrome بدل معاينة الملفات.</p><p id="loginerr" class="bad"></p></section><section id="app" class="hidden"><div class="card"><b id="who"></b><div class="actions"><button class="alt" onclick="logout()">خروج</button><button class="alt" onclick="exportData()">تنزيل نسخة احتياطية JSON</button></div></div><nav id="nav"></nav><div id="content"></div><div id="notice"></div></section></main><script>
const D=[['25 هللة',25],['50 هللة',50],['1 ريال',100],['5 ريالات',500],['10 ريالات',1000],['20 ريال',2000],['50 ريال',5000],['100 ريال',10000],['200 ريال',20000],['500 ريال',50000]];const K='hikaya_demo_v1';let db=(()=>{try{return JSON.parse(localStorage.getItem(K)||'null')}catch(e){return null}})()||{users:[{id:'admin',name:'المدير',role:'manager',password:'12345678'},{id:'brother',name:'الأخ',role:'manager',password:'12345678'},{id:'cashier',name:'موظف تجريبي',role:'cashier',password:'12345678'}],shifts:[],invoices:[],advances:[],requests:[]};let current=null,tab='dashboard';const $=id=>document.getElementById(id),money=c=>(c/100).toFixed(2)+' ر.س',cents=v=>Math.round((Number(v)||0)*100),save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}},now=()=>new Date().toLocaleString('ar-SA'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),note=s=>{$('notice').textContent=s;setTimeout(()=>{$('notice').textContent=''},4000)};function login(){let u=db.users.find(x=>x.id===$('user').value.trim()&&x.password===$('pass').value);if(!u){$('loginerr').textContent='بيانات الدخول غير صحيحة';return}current=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}function logout(){current=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pass').value=''}function setTab(t){tab=t;render()}function render(){if(!current)return;$('who').textContent='مرحبًا، '+current.name+' ('+(current.role==='manager'?'إدارة':'كاشير')+')';let tabs=[['dashboard','الرئيسية'],['shift','الجرد والشفت'],['invoices','الفواتير'],['advance','السلف'],['handover','تسليم الشفت']];if(current.role==='manager')tabs.push(['history','سجل الجرد السابق'],['staff','الموظفون'],['reports','التقارير']);$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'':'alt'}" onclick="setTab('${k}')">${v}</button>`).join('');({dashboard,shift,invoices,advance,handover,history,staff,reports})[tab]()}function view(html){$('content').innerHTML=html}function field(label,id,type='number',value=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01"':''}></label>`}function activeShift(){return db.shifts.find(x=>x.owner===current.id&&!x.closed)}function dashboard(){let total=db.shifts.filter(s=>s.closed).reduce((a,s)=>a+s.difference,0);view(`<div class="card"><h2>ملخص النظام</h2><div class="grid"><div class="stat">الفترات المسجلة<b>${db.shifts.length}</b></div><div class="stat">الفواتير<b>${db.invoices.length}</b></div><div class="stat">طلبات السلف<b>${db.advances.length}</b></div><div class="stat">صافي فروقات الشفتات المغلقة<b class="${total<0?'bad':'ok'}">${money(total)}</b></div></div><p class="muted">هذه نسخة محلية للتجربة. البيانات محفوظة على هذا المتصفح فقط وليست مشتركة بين الأجهزة.</p></div>`)}function countFields(prefix){return `<div class="card" style="text-align:center"><p>إجمالي النقد الموجود في الدرج</p><h2 id="${prefix}total">0.00 ر.س</h2></div><label>الأوراق النقدية — اكتب إجمالي المبلغ بالريال<input type="number" min="0" step="1" id="${prefix}paper" value="0" oninput="preview('${prefix}')"></label><h3>العملات المعدنية — اكتب عدد كل فئة</h3><div class="grid">${[['2 ريال',200],['1 ريال',100],['50 هللة',50],['25 هللة',25]].map(([name,v],i)=>`<label>${name}<input type="number" min="0" step="1" id="${prefix}metal${i}" value="0" oninput="preview('${prefix}')"></label>`).join('')}</div>`}
function getCounts(prefix){return [0,1,2,3].map(i=>Math.max(0,Math.floor(Number($(prefix+'metal'+i)?.value)||0)))}
function metalValue(arr){return arr.reduce((s,n,i)=>s+n*[200,100,50,25][i],0)}
function count(prefix){return cents($(prefix+'paper')?.value)+metalValue(getCounts(prefix))}
function preview(prefix){$(prefix+'total').textContent=money(count(prefix))}
function priorEvening(){return db.shifts.filter(s=>s.closed&&s.period==='مسائية').at(-1)||null}
function movement(s){if(s.previousCarry==null)return 'لا يوجد رصيد سابق';let d=s.end-s.previousCarry;return (d>0?'زيادة ':d<0?'نقص ':'بدون تغير ')+money(Math.abs(d))}
function coinsDetail(s,side){let v=s[side+'MetalCounts']||[];return [['2 ريال',200],['1 ريال',100],['50 هللة',50],['25 هللة',25]].map(([n,x],i)=>n+': '+(v[i]||0)).join(' | ')}
function shift(){let a=activeShift();if(!a){view(`<div class="card"><h2>فتح شفت جديد</h2><label>الفترة<select id="period"><option value="صباحية">صباحية</option><option value="مسائية">مسائية</option></select></label><h3>جرد بداية الفترة</h3>${countFields('start')}<p class="muted">آخر جرد مسائي سابق: ${priorEvening()?money(priorEvening().end):'غير متوفر'}</p><label>صورة جرد البداية (اختيارية للتجربة)<input type="file" id="startphoto" accept="image/*"></label>${field('رصيد البداية المتوقع (اختياري للمقارنة)','opening','number','0')}<button onclick="startShift()">فتح الشفت وحفظ جرد البداية</button></div>`);return}let inv=db.invoices.filter(x=>x.shiftId===a.id),expense=inv.reduce((s,x)=>s+x.amount,0);view(`<div class="card"><h2>شفت ${a.period} — ${esc(a.ownerName)}</h2><p>بدأ: ${esc(a.started)}</p><p>رصيد بداية الفترة الفعلي: <b>${money(a.start)}</b></p><p>المشتريات والمخرجات المسجلة: <b>${money(expense)}</b></p><h3>جرد نهاية الفترة</h3>${countFields('end')}<p class="muted">رصيد آخر مساء مرحّل: ${a.previousCarry==null?'غير متوفر':money(a.previousCarry)}. صافي الحركة = جرد النهاية ناقص رصيد المساء السابق؛ لا يعني الربح أو العجز.</p><label>صورة جرد النهاية (اختيارية للتجربة)<input type="file" id="endphoto" accept="image/*"></label>${field('مبيعات الشبكة للفترة','network')}${field('مبيعات برنامج المحل (كاش + شبكة)','sales')}${field('سحوبات أو إيداعات أخرى صافية (+ إيداع / - سحب)','adjustment','number','0')}<button onclick="closeShift()">حساب الفرق وإغلاق الشفت</button><p class="muted">المفترض = رصيد البداية + مبيعات البرنامج - الشبكة - الفواتير النقدية + التعديلات. لا تُحسب الشبكة مرتين.</p></div>`)}function photoData(id){return new Promise(resolve=>{let f=$(id)?.files?.[0];if(!f)return resolve('');if(f.size>500000){alert('الصورة أكبر من 500 كيلوبايت. اختر صورة أصغر لتناسب التخزين المحلي.');return resolve('')}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve('');r.readAsDataURL(f)})}async function startShift(){let counts=getCounts('start'),photo=await photoData('startphoto');let previous=priorEvening();let a={cashEntryVersion:2,previousCarry:previous?previous.end:null,previousMetal:previous?.endMetalCounts||null,startPaper:cents($('startpaper').value),startMetalCounts:counts,startCounts:counts,startPhoto:photo,id:Date.now().toString(),owner:current.id,ownerName:current.name,period:$('period').value,start:count('start'),opening:cents($('opening').value),started:now(),closed:false};db.shifts.push(a);save();render();note('تم فتح الشفت')}async function closeShift(){let endCounts=getCounts('end'),endPhoto=await photoData('endphoto');let a=activeShift();if(!a)return;let inv=db.invoices.filter(x=>x.shiftId===a.id).reduce((s,x)=>s+x.amount,0);a.end=count('end');a.endPaper=cents($('endpaper').value);a.endMetalCounts=endCounts;a.endCounts=endCounts;a.endPhoto=endPhoto;a.network=cents($('network').value);a.sales=cents($('sales').value);a.adjustment=cents($('adjustment').value);a.expected=a.start+a.sales-a.network-inv+a.adjustment;a.difference=a.end-a.expected;a.closed=true;a.ended=now();save();render();note('تم إغلاق الشفت. فرق الجرد: '+money(a.difference)+' | حركة النقد: '+movement(a))}function invoices(){let a=activeShift();view(`<div class="card"><h2>تسجيل فاتورة</h2><p class="muted">ترتبط الفاتورة بالشفت المفتوح، وتخصم مرة واحدة من رصيد الدرج المتوقع.</p><label>النوع<select id="invtype"><option>مشتريات</option><option>مخرجات</option></select></label>${field('المورد / سبب الصرف','invname','text')}${field('المبلغ بالريال والهللة','invamount')}<label>صورة الفاتورة<input type="file" id="invphoto" accept="image/*" capture="environment"></label><button ${a?'':'disabled'} onclick="addInvoice()">حفظ الفاتورة</button>${a?'':'<p class="bad">افتح شفت أولًا لإضافة فاتورة.</p>'}</div><div class="card"><h2>الفواتير المسجلة</h2><table><tr><th>النوع</th><th>البيان</th><th>المبلغ</th><th>الموظف</th></tr>${db.invoices.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td>${esc(x.ownerName)}</td></tr>`).join('')}</table></div>`)}function addInvoice(){let a=activeShift(),f=$('invphoto').files[0],name=$('invname').value.trim(),amount=cents($('invamount').value);if(!a||!name||amount<=0||!f){alert('أدخل البيان والمبلغ وأرفق صورة الفاتورة');return}if(f.size>1500000){alert('استخدم صورة أصغر من 1.5 ميجابايت في هذه النسخة التجريبية');return}let r=new FileReader();r.onload=()=>{db.invoices.push({id:Date.now(),shiftId:a.id,type:$('invtype').value,name,amount,ownerName:current.name,photo:r.result,date:now()});try{save();render();note('تم حفظ الفاتورة')}catch(e){db.invoices.pop();alert('مساحة التخزين المحلية غير كافية')}};r.readAsDataURL(f)}function advance(){view(`<div class="card"><h2>طلبات السلف</h2>${field('مبلغ السلفة','advamount')}<button onclick="requestAdvance()">إرسال طلب سلفة</button></div><div class="card"><h3>الطلبات</h3><table><tr><th>الموظف</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr>${db.advances.filter(x=>current.role==='manager'||x.owner===current.id).map(x=>`<tr><td>${esc(x.ownerName)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td><td>${current.role==='manager'&&x.status==='معلق'?`<button onclick="decideAdvance('${x.id}','موافق')">موافقة</button> <button class="danger" onclick="decideAdvance('${x.id}','مرفوض')">رفض</button>`:''}</td></tr>`).join('')}</table></div>`)}function requestAdvance(){let amount=cents($('advamount').value);if(amount<=0)return;db.advances.push({id:Date.now().toString(),owner:current.id,ownerName:current.name,amount,status:'معلق',date:now()});save();render()}function decideAdvance(id,status){let a=db.advances.find(x=>x.id===id);if(a){a.status=status;a.approvedBy=current.name;save();render()}}function handover(){view(`<div class="card"><h2>سجل تسليم الشفتات</h2><p class="muted">للتجربة: أغلق الشفت ثم يستطيع الموظف المستلم تأكيد الجرد في حسابه.</p><table><tr><th>الفترة</th><th>الموظف</th><th>نهاية الجرد</th><th>الفرق</th><th>الاستلام</th></tr>${db.shifts.filter(x=>x.closed).map(x=>`<tr><td>${esc(x.period)}</td><td>${esc(x.ownerName)}</td><td>${money(x.end)}</td><td>${money(x.difference)}</td><td>${x.receivedBy?esc(x.receivedBy):x.owner!==current.id?`<button onclick="receive('${x.id}')">تأكيد استلام بعد العد</button>`:'بانتظار المستلم'}</td></tr>`).join('')}</table></div>`)}function receive(id){let x=db.shifts.find(s=>s.id===id);if(!x||x.receivedBy)return;let entered=prompt('كم المبلغ الذي عددته فعليًا بالريال والهللة؟');if(entered===null)return;let c=cents(entered);if(c!==x.end){alert('هناك فرق '+money(c-x.end)+'، لا يمكن اعتماد الاستلام قبل المراجعة');return}x.receivedBy=current.name;x.receivedAt=now();save();render()}function history(){if(current.role!=='manager'){view('<div class="card">هذا القسم للإدارة فقط.</div>');return}let oldPeriod=$('historyPeriod')?.value||'الكل',oldStaff=$('historyStaff')?.value||'الكل';let users=[...new Set(db.shifts.map(s=>s.ownerName||s.owner||'غير معروف'))];let list=db.shifts.filter(s=>(oldPeriod==='الكل'||s.period===oldPeriod)&&(oldStaff==='الكل'||(s.ownerName||s.owner||'غير معروف')===oldStaff)).slice().reverse();view(`<div class="card"><h2>سجل الجرد السابق</h2><p class="muted">للمدير والأخ: تفاصيل جميع الفترات المسجلة على هذا المتصفح فقط. لا تتزامن البيانات بين الأجهزة في هذه النسخة.</p><div class="grid"><label>الفترة<select id="historyPeriod" onchange="history()"><option value="الكل">جميع الفترات</option>${['صباحية','مسائية'].map(p=>`<option value="${p}" ${oldPeriod===p?'selected':''}>${p}</option>`).join('')}</select></label><label>الموظف<select id="historyStaff" onchange="history()"><option value="الكل">جميع الموظفين</option>${users.map(n=>`<option value="${esc(n)}" ${oldStaff===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div><p>عدد الفترات: <b>${list.length}</b></p>${list.length?list.map((s,i)=>`<details class="stat" style="margin:12px 0"><summary style="cursor:pointer"><b>${esc(s.period||'غير محددة')} — ${esc(s.ownerName||s.owner||'غير معروف')}</b> ${esc(s.started||'')} — ${s.closed?`الفرق: <strong class="${s.difference<0?'bad':'ok'}">${money(s.difference||0)}</strong>`:'شفت مفتوح'}</summary><div style="margin-top:12px"><div class="grid"><div>بداية الشفت: <b>${money(s.start||0)}</b></div><div>نهاية الشفت: <b>${s.closed?money(s.end||0):'لم يغلق'}</b></div><div>المتوقع عند الإغلاق: <b>${s.closed?money(s.expected||0):'—'}</b></div><div>الفرق: <b class="${s.difference<0?'bad':'ok'}">${s.closed?money(s.difference||0):'—'}</b></div></div><p>تاريخ البداية: ${esc(s.started||'غير مسجل')} | النهاية: ${esc(s.ended||'لم يغلق')}</p>${s.cashEntryVersion===2?`<h3>جرد الأوراق والمعادن</h3><p>أوراق البداية: ${money(s.startPaper||0)} | أوراق النهاية: ${s.closed?money(s.endPaper||0):'—'}</p><p>معادن البداية: ${money(metalValue(s.startMetalCounts||[]))} | معادن النهاية: ${s.closed?money(metalValue(s.endMetalCounts||[])):'—'}</p><p>تفاصيل المعادن بداية: ${coinsDetail(s,'start')}</p><p>تفاصيل المعادن نهاية: ${s.closed?coinsDetail(s,'end'):'—'}</p><p>رصيد آخر مساء سابق: ${s.previousCarry==null?'غير متوفر':money(s.previousCarry)} | صافي حركة النقد: ${s.closed?movement(s):'—'}</p><p>معادن آخر مساء سابق: ${s.previousMetal?money(metalValue(s.previousMetal)):'غير متوفر'} | تغير المعادن: ${s.closed&&s.previousMetal?money(metalValue(s.endMetalCounts||[])-metalValue(s.previousMetal)):'—'}</p>`:`<h3>تفاصيل الفئات النقدية (السجل القديم)</h3><div style="overflow-x:auto"><table><tr><th>الفئة</th><th>عدد البداية</th><th>قيمة البداية</th><th>عدد النهاية</th><th>قيمة النهاية</th></tr>${D.map(([name,v],j)=>`<tr><td>${name}</td><td>${s.startCounts?Number(s.startCounts[j]||0):'غير محفوظ'}</td><td>${s.startCounts?money((s.startCounts[j]||0)*v):'—'}</td><td>${s.endCounts?Number(s.endCounts[j]||0):'غير محفوظ'}</td><td>${s.endCounts?money((s.endCounts[j]||0)*v):'—'}</td></tr>`).join('')}</table></div>`:''}<h3>صور الجرد</h3><div class="grid"><div>صورة البداية: ${s.startPhoto?`<a href="${s.startPhoto}" target="_blank"><img src="${s.startPhoto}" alt="جرد البداية" style="max-width:100%;max-height:220px;border-radius:8px"></a>`:'لا توجد صورة محفوظة'}</div><div>صورة النهاية: ${s.endPhoto?`<a href="${s.endPhoto}" target="_blank"><img src="${s.endPhoto}" alt="جرد النهاية" style="max-width:100%;max-height:220px;border-radius:8px"></a>`:'لا توجد صورة محفوظة'}</div></div><h3>حركة الشفت</h3><p>مبيعات البرنامج: ${s.closed?money(s.sales||0):'—'} | مبيعات الشبكة: ${s.closed?money(s.network||0):'—'} | التعديلات: ${s.closed?money(s.adjustment||0):'—'}</p><p>فواتير نقدية: ${money(db.invoices.filter(x=>x.shiftId===s.id).reduce((a,x)=>a+(x.amount||0),0))}</p></div></details>`).join(''):'<p class="muted">لا توجد فترات مطابقة للفلتر.</p>'}</div>`)}function staff(){if(current.role!=='manager')return;view(`<div class="card"><h2>إضافة موظف</h2>${field('اسم الموظف','staffname','text')}${field('اسم المستخدم (يوزر)','staffuser','text')}${field('كلمة مرور مؤقتة (8 أحرف على الأقل)','staffpass','text')}<label>الصلاحية<select id="staffrole"><option value="cashier">كاشير</option><option value="manager">إدارة</option></select></label><button onclick="addStaff()">إضافة الحساب</button></div><div class="card"><h2>الموظفون</h2><table><tr><th>الاسم</th><th>اليوزر</th><th>الصلاحية</th><th>كلمة المرور</th></tr>${db.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.id)}</td><td>${x.role==='manager'?'إدارة':'كاشير'}</td><td><button class="alt" onclick="resetPass('${esc(x.id)}')">إعادة تعيين</button></td></tr>`).join('')}</table></div>`)}function addStaff(){let name=$('staffname').value.trim(),id=$('staffuser').value.trim(),password=$('staffpass').value;if(!name||!id||password.length<8||db.users.some(x=>x.id===id)){alert('راجع الاسم واليوزر وكلمة المرور');return}db.users.push({name,id,password,role:$('staffrole').value});save();render()}function resetPass(id){let p=prompt('أدخل كلمة مرور مؤقتة جديدة (8 أحرف على الأقل)');if(!p||p.length<8)return;let u=db.users.find(x=>x.id===id);if(u){u.password=p;save();note('تمت إعادة تعيين كلمة المرور')}}function reports(){let rows=db.shifts.filter(s=>s.closed);view(`<div class="card"><h2>تقارير الشفتات</h2><table><tr><th>الفترة</th><th>الموظف</th><th>مبيعات البرنامج</th><th>الشبكة</th><th>الموجود</th><th>العجز / الزيادة</th></tr>${rows.map(x=>`<tr><td>${esc(x.period)}</td><td>${esc(x.ownerName)}</td><td>${money(x.sales)}</td><td>${money(x.network)}</td><td>${money(x.end)}</td><td class="${x.difference<0?'bad':'ok'}">${money(x.difference)}</td></tr>`).join('')}</table><div class="actions"><button onclick="exportCsv()">تصدير CSV</button></div></div>`)}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('hikaya-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCsv(){let r=[['الفترة','الموظف','مبيعات البرنامج','الشبكة','الجرد','الفرق'],...db.shifts.filter(s=>s.closed).map(s=>[s.period,s.ownerName,s.sales/100,s.network/100,s.end/100,s.difference/100])];download('hikaya-report.csv','\ufeff'+r.map(a=>a.join(',')).join('\n'),'text/csv')}
</script></body></html>
